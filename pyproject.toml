[project]
name = "pythonproject-fs"
version = "0.1.0"
description = "Backend API with FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.10.4",
    "alembic>=1.17.0",
    "fastapi>=0.136.0",
    "pydantic-settings>=2.10.1",
    "psycopg[binary]>=3.2.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.45.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
